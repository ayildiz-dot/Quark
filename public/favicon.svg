<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Quark tab icon.

    Each of the three orbit rings is a genuinely distinct ellipse, rotated 0,
    60 and 120 degrees. Earlier versions relied on an SVG transform attribute
    to rotate a shared path definition per ring; animateMotion's mpath
    reference does not reliably respect a transform on its target path across
    browsers, which caused all three dots to travel along the same untransformed
    line regardless of which ring they visually belonged to.

    Fixed by computing each ring's rotated coordinates directly in Python and
    writing them out as an explicit sampled polyline, once per ring. There is
    no transform attribute anywhere in this file any more. The visible ellipse
    for a given ring and the invisible motion path for that ring's dot are
    built from the exact same coordinate list, so they are guaranteed to be
    the same shape in the same position, not merely intended to be.

    Colors match the app's real tokens: accent blue 3b82f6, success green
    10b981, warning amber f59e0b, and the terracotta core d85a30 already used
    on the slate accent scheme.

    The animation mechanism is SMIL, supported in Chrome, Firefox and Edge.
    Safari does not animate tab favicons at all for any site, so it falls back
    to the static mark there, which is expected rather than a bug in this file.
  -->
  <g transform="translate(24,24)">

